<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classic Design — ADDER</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    .diagram-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .diagram-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .diagram-viewport {
      background: radial-gradient(rgba(21, 27, 32, 0.12) 1px, transparent 1px);
      background-size: 18px 18px;
      background-color: var(--cream);
      border: var(--border-ink);
      border-radius: var(--radius-sm);
      padding: 24px;
      min-height: 340px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-stage {
      transform-origin: top center;
      transition: transform 0.15s ease;
      display: inline-block;
    }
    .diagram-stage svg {
      height: auto;
      min-width: 680px;
      font-family: var(--font-sans) !important;
    }
    .diagram-stage .node rect,
    .diagram-stage .node polygon,
    .diagram-stage .node circle {
      stroke: #151b20 !important;
      stroke-width: 2.2px !important;
      rx: 8px;
      ry: 8px;
    }
    .diagram-stage .nodeLabel {
      font-weight: 700 !important;
      font-size: 16px !important;
      color: #151b20 !important;
    }
    .diagram-stage .edgePath .path {
      stroke: #151b20 !important;
      stroke-width: 2.2px !important;
    }
    .diagram-stage .edgeLabel {
      background-color: #fffaf0 !important;
      padding: 3px 7px !important;
      border-radius: 6px;
      font-family: var(--font-mono) !important;
      font-size: 13px !important;
      font-weight: 700 !important;
    }
    .plots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
    }
    .ref-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.88rem;
    }
    .ref-list a {
      color: #0e7490;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-group" href="index.html">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24"><path d="M6 2v2H4a2 2 0 0 0-2 2v2h2v2H2v2h2v2H2v2h2a2 2 0 0 0 2 2v2h2v-2h2v2h2v-2h2v2h2v-2h2a2 2 0 0 0 2-2v-2h2v-2h-2v-2h2v-2h-2V6a2 2 0 0 0-2-2h-2V2h-2v2h-2V2h-2v2H8V2H6m2 4h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2m1 2v8h6V8H9z"/></svg>
          <span>ADDER</span>
        </div>
        <div class="brand-meta">
          <span class="brand-name">Classic Design Dossier</span>
          <span class="brand-sub">Block Diagram, Scaling Bottlenecks &amp; References</span>
        </div>
      </a>
      <div class="header-actions">
        <a class="btn-neo btn-yellow" href="index.html">&larr; Back to Classic Design</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="design-content">
      <div class="section-card"><p>Loading design details…</p></div>
    </div>
  </main>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      flowchart: {
        useMaxWidth: false,
        htmlLabels: true,
        curve: 'basis',
        nodeSpacing: 52,
        rankSpacing: 72,
        padding: 18
      },
      themeVariables: {
        fontFamily: 'Inter, sans-serif',
        fontSize: '17px',
        primaryColor: '#fff0b9',
        primaryTextColor: '#151b20',
        primaryBorderColor: '#151b20',
        lineColor: '#151b20',
        secondaryColor: '#c9f3f4',
        tertiaryColor: '#e7f4c8',
        edgeLabelBackground: '#fffaf0'
      }
    });

    let zoomScale = 1.0;
    let baseSvgWidth = null;

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function mdInline(s) {
      return esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function setZoom(val) {
      zoomScale = Math.max(0.4, Math.min(2.2, val));
      const svg = document.querySelector('#diagram-stage svg');
      const lbl = document.getElementById('zoom-label');
      if (svg && baseSvgWidth) {
        svg.style.minWidth = '0';
        svg.style.width = `${Math.round(baseSvgWidth * zoomScale)}px`;
      }
      if (lbl) lbl.textContent = `${Math.round(zoomScale * 100)}%`;
    }

    function colorizeDiagram() {
      const svg = document.querySelector('#diagram-stage svg');
      if (!svg) return;
      svg.querySelectorAll('.node').forEach(node => {
        const txt = (node.textContent || '').trim();
        const shape = node.querySelector('rect, polygon, circle');
        if (!shape) return;
        if (/^(A|B|Cin|Input|Operand)/i.test(txt)) {
          shape.style.fill = '#c9f3f4';
        } else if (/^(S|Sum|Cout|Out|Result)/i.test(txt)) {
          shape.style.fill = '#e7f4c8';
        } else {
          shape.style.fill = '#fff0b9';
        }
      });
    }

    function downloadSvg(slug) {
      const svg = document.querySelector('#diagram-stage svg');
      if (!svg) return;
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${slug}_block_diagram.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function buildScalingPlot(scaling, key, title, unit, color) {
      if (!scaling || scaling.length < 2) return '<p>No scaling data.</p>';
      const w = 460, h = 240, padL = 62, padR = 20, padT = 22, padB = 38;
      const maxVal = Math.max(...scaling.map(s => s[key])) * 1.1 || 1;
      const sx = i => padL + (i / (scaling.length - 1)) * (w - padL - padR);
      const sy = v => h - padB - (v / maxVal) * (h - padT - padB);

      const poly = scaling.map((s, i) => `${sx(i).toFixed(1)},${sy(s[key]).toFixed(1)}`).join(' ');
      const dots = scaling.map((s, i) => `
        <circle cx="${sx(i).toFixed(1)}" cy="${sy(s[key]).toFixed(1)}" r="4.5" fill="${color}" stroke="#151b20" stroke-width="1.6">
          <title>${s.width}-bit: ${s[key]} ${unit}</title>
        </circle>
        <text x="${sx(i).toFixed(1)}" y="${h - padB + 16}" text-anchor="middle" font-size="10" font-family="JetBrains Mono">${s.width}</text>
      `).join('');

      const yTicks = [0, 0.5, 1.0].map(f => {
        const val = maxVal * f;
        const y = sy(val);
        const label = val >= 1000 ? `${(val/1000).toFixed(1)}k` : val.toFixed(1);
        return `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="rgba(21,27,32,0.12)" stroke-dasharray="3,3"/>
          <text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="10" font-family="JetBrains Mono">${label}</text>
        `;
      }).join('');

      return `
        <div style="font-weight:800; font-size:0.9rem; margin-bottom:6px;">${title} (${unit})</div>
        <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
          ${yTicks}
          <line x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}" stroke="#151b20" stroke-width="2"/>
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h - padB}" stroke="#151b20" stroke-width="2"/>
          <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="3"/>
          ${dots}
          <text x="${(w + padL - padR)/2}" y="${h - 4}" text-anchor="middle" font-size="11" font-weight="700">Bit Width (N)</text>
        </svg>
      `;
    }

    async function loadDesign() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      const res = await fetch('data.json');
      const data = await res.json();
      const d = data.classical.find(c => c.slug === slug);
      const root = document.getElementById('design-content');
      if (!d) {
        root.innerHTML = '<div class="section-card"><h2>Design not found</h2><p><a href="index.html">Return to Classic Design</a></p></div>';
        return;
      }
      document.title = `${d.name} — Classic Design`;

      const charsHtml = (d.characteristics && d.characteristics.length)
        ? `<ul>${d.characteristics.map(c => `<li>${mdInline(c)}</li>`).join('')}</ul>`
        : '<p>See width scaling table below.</p>';
      const usesHtml = (d.use_cases && d.use_cases.length)
        ? `<ul>${d.use_cases.map(u => `<li>${mdInline(u)}</li>`).join('')}</ul>`
        : '<p>General-purpose integer arithmetic datapaths.</p>';

      const sc = d.scaling || [];
      let growthSummary = '';
      if (sc.length >= 2) {
        const first = sc[0], last = sc[sc.length - 1];
        const areaRatio = first.area > 0 ? (last.area / first.area).toFixed(1) : '—';
        const delayRatio = first.delay > 0 ? (last.delay / first.delay).toFixed(2) : '—';
        growthSummary = `<p class="section-sub"><strong>Observed ${first.width}-bit &rarr; ${last.width}-bit growth:</strong> Area scales <strong>${areaRatio}&times;</strong> (${first.area.toFixed(0)} &rarr; ${last.area.toFixed(0)} &mu;m&sup2;) and Delay scales <strong>${delayRatio}&times;</strong> (${first.delay.toFixed(2)} &rarr; ${last.delay.toFixed(2)} ns).</p>`;
      }

      const complexityBullets = [...(d.complexity || []), ...(d.impl_notes || [])];
      const scalingIssuesHtml = complexityBullets.length
        ? `<ul>${complexityBullets.map(b => `<li>${mdInline(b)}</li>`).join('')}</ul>`
        : '<p>See scaling plots and table below.</p>';

      const refsHtml = (d.references && d.references.length)
        ? `<ol class="ref-list">${d.references.map(r => `<li><strong>[${esc(r.id)}]</strong> ${esc(r.text)}${r.url ? ` <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.url)}</a>` : ''}</li>`).join('')}</ol>`
        : '<p>No references recorded.</p>';

      const scalingRows = sc.map(s => `
        <tr>
          <td class="mono">${s.width}-bit</td>
          <td class="mono">${s.area.toFixed(2)}</td>
          <td class="mono">${s.delay.toFixed(2)}</td>
          <td class="mono">${s.freq.toFixed(1)}</td>
          <td class="mono">${s.power.toFixed(2)}</td>
          <td class="mono">${s.cells}</td>
        </tr>
      `).join('');

      root.innerHTML = `
        <div class="hero" style="padding:24px 28px;">
          <span class="pill pill-pareto" style="margin-bottom:10px;">Classic Design</span>
          <h1>${esc(d.name)} Adder</h1>
          <p style="margin-bottom:0;">${mdInline(d.overview || '')}</p>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card accent-cyan">
            <div class="kpi-val">${d.area_512 != null ? d.area_512.toFixed(0) : '—'}</div>
            <div class="kpi-label">512-bit Area (&mu;m&sup2;)</div>
          </div>
          <div class="kpi-card accent-yellow">
            <div class="kpi-val">${d.freq_512_mhz != null ? d.freq_512_mhz.toFixed(1) : '—'}</div>
            <div class="kpi-label">512-bit Speed (MHz)</div>
          </div>
          <div class="kpi-card accent-lime">
            <div class="kpi-val">${d.delay_512_ns != null ? d.delay_512_ns.toFixed(2) : '—'}</div>
            <div class="kpi-label">512-bit Delay (ns)</div>
          </div>
          <div class="kpi-card accent-purple">
            <div class="kpi-val">${d.power_512_mw != null ? d.power_512_mw.toFixed(2) : '—'}</div>
            <div class="kpi-label">512-bit Power (mW)</div>
          </div>
        </div>

        <div class="section-card">
          <h2>Block Diagram &amp; Datapath</h2>
          <div class="diagram-toolbar">
            <div class="diagram-legend">
              <span><span class="legend-dot" style="background:#c9f3f4;"></span>Inputs (A, B, Cin)</span>
              <span><span class="legend-dot" style="background:#fff0b9;"></span>Logic / Carry Stages</span>
              <span><span class="legend-dot" style="background:#e7f4c8;"></span>Outputs (Sum, Cout)</span>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn-mini" onclick="setZoom(zoomScale - 0.15)">-</button>
              <span id="zoom-label" class="mono" style="font-size:0.78rem; min-width:44px; text-align:center;">100%</span>
              <button class="btn-mini" onclick="setZoom(zoomScale + 0.15)">+</button>
              <button class="btn-mini" onclick="setZoom(1.0)">Reset</button>
              <button class="btn-mini" style="background:var(--yellow);" onclick="downloadSvg('${d.slug}')">Download SVG</button>
            </div>
          </div>
          <div class="diagram-viewport">
            <div id="diagram-stage" class="diagram-stage">
              ${d.mermaid ? `<pre class="mermaid">${esc(d.mermaid)}</pre>` : '<p>No block diagram available.</p>'}
            </div>
          </div>
        </div>

        <div class="section-card">
          <h2>Nangate45 + OpenSTA Scaling &amp; Width Behavior (8-bit &rarr; 512-bit)</h2>
          ${growthSummary}
          ${scalingIssuesHtml}
          <div class="plots-grid" style="margin-top:16px;">
            <div class="chart-box">${buildScalingPlot(sc, 'area', 'Area Scaling vs. Width', 'um^2', '#22bfd7')}</div>
            <div class="chart-box">${buildScalingPlot(sc, 'delay', 'Delay Scaling vs. Width', 'ns', '#f38469')}</div>
          </div>
        </div>

        <div class="kw-grid" style="margin-bottom:24px;">
          <div class="section-card" style="margin-bottom:0;">
            <h2>Key Characteristics</h2>
            ${charsHtml}
          </div>
          <div class="section-card" style="margin-bottom:0;">
            <h2>Typical Use Cases</h2>
            ${usesHtml}
          </div>
        </div>

        <div class="section-card">
          <h2>Nangate45 Width Scaling Data (8-bit to 512-bit)</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Width</th>
                  <th>Area (&mu;m&sup2;)</th>
                  <th>Delay (ns)</th>
                  <th>Frequency (MHz)</th>
                  <th>Power (mW)</th>
                  <th>Cells</th>
                </tr>
              </thead>
              <tbody>${scalingRows}</tbody>
            </table>
          </div>
        </div>

        <div class="section-card">
          <h2>References</h2>
          ${refsHtml}
        </div>
      `;

      if (d.mermaid) {
        await mermaid.run({ querySelector: '.mermaid' });
        colorizeDiagram();
        const svg = document.querySelector('#diagram-stage svg');
        if (svg) {
          baseSvgWidth = (svg.getBoundingClientRect().width || 720) * 0.70;
          setZoom(1.0);
        }
      }
    }

    loadDesign();
  </script>
</body>
</html>
