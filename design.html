<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classic Design — ADDER</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    .diagram-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .diagram-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .diagram-viewport {
      background:
        radial-gradient(rgba(21, 27, 32, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
      background-color: var(--cream);
      border: var(--border-ink);
      border-radius: var(--radius-sm);
      padding: 20px;
      min-height: 280px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-stage {
      transform-origin: center center;
      transition: transform 0.15s ease;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .diagram-stage svg {
      max-width: 100%;
      height: auto;
      font-family: var(--font-sans) !important;
    }
    .diagram-stage .node rect,
    .diagram-stage .node polygon,
    .diagram-stage .node circle {
      stroke: #151b20 !important;
      stroke-width: 2px !important;
      rx: 8px;
      ry: 8px;
    }
    .diagram-stage .nodeLabel {
      font-weight: 700 !important;
      font-size: 13px !important;
      color: #151b20 !important;
    }
    .diagram-stage .edgePath .path {
      stroke: #151b20 !important;
      stroke-width: 2px !important;
    }
    .diagram-stage .edgeLabel {
      background-color: #fffaf0 !important;
      padding: 2px 6px !important;
      border-radius: 6px;
      font-family: var(--font-mono) !important;
      font-size: 11px !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-group" href="index.html">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24"><path d="M6 2v2H4a2 2 0 0 0-2 2v2h2v2H2v2h2v2H2v2h2a2 2 0 0 0 2 2v2h2v-2h2v2h2v-2h2v2h2v-2h2a2 2 0 0 0 2-2v-2h2v-2h-2v-2h2v-2h-2V6a2 2 0 0 0-2-2h-2V2h-2v2h-2V2h-2v2H8V2H6m2 4h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2m1 2v8h6V8H9z"/></svg>
          <span>ADDER</span>
        </div>
        <div class="brand-meta">
          <span class="brand-name">Classic Design Dossier</span>
          <span class="brand-sub">Block Diagram, Architecture &amp; Width Scaling</span>
        </div>
      </a>
      <div class="header-actions">
        <a class="btn-neo btn-yellow" href="index.html">&larr; Back to Classic Design</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="design-content">
      <div class="section-card"><p>Loading design details…</p></div>
    </div>
  </main>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis',
        nodeSpacing: 42,
        rankSpacing: 58,
        padding: 14
      },
      themeVariables: {
        fontFamily: 'Inter, sans-serif',
        primaryColor: '#fff0b9',
        primaryTextColor: '#151b20',
        primaryBorderColor: '#151b20',
        lineColor: '#151b20',
        secondaryColor: '#c9f3f4',
        tertiaryColor: '#e7f4c8',
        edgeLabelBackground: '#fffaf0'
      }
    });

    let zoomScale = 1.0;

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function mdInline(s) {
      return esc(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function setZoom(val) {
      zoomScale = Math.max(0.5, Math.min(2.2, val));
      const stage = document.getElementById('diagram-stage');
      const lbl = document.getElementById('zoom-label');
      if (stage) stage.style.transform = `scale(${zoomScale.toFixed(2)})`;
      if (lbl) lbl.textContent = `${Math.round(zoomScale * 100)}%`;
    }

    function colorizeDiagram() {
      const svg = document.querySelector('#diagram-stage svg');
      if (!svg) return;
      svg.querySelectorAll('.node').forEach(node => {
        const txt = (node.textContent || '').trim();
        const shape = node.querySelector('rect, polygon, circle');
        if (!shape) return;
        if (/^(A|B|Cin|Input|Operand)/i.test(txt)) {
          shape.style.fill = '#c9f3f4'; // Cyan soft for inputs
        } else if (/^(S|Sum|Cout|Out|Result)/i.test(txt)) {
          shape.style.fill = '#e7f4c8'; // Lime soft for outputs
        } else {
          shape.style.fill = '#fff0b9'; // Yellow soft for logic stages
        }
      });
    }

    function downloadSvg(slug) {
      const svg = document.querySelector('#diagram-stage svg');
      if (!svg) return;
      const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${slug}_block_diagram.svg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function loadDesign() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      const res = await fetch('data.json');
      const data = await res.json();
      const d = data.classical.find(c => c.slug === slug);
      const root = document.getElementById('design-content');
      if (!d) {
        root.innerHTML = '<div class="section-card"><h2>Design not found</h2><p><a href="index.html">Return to Classic Design</a></p></div>';
        return;
      }
      document.title = `${d.name} — Classic Design`;

      const charsHtml = (d.characteristics && d.characteristics.length)
        ? `<ul>${d.characteristics.map(c => `<li>${mdInline(c)}</li>`).join('')}</ul>`
        : '<p>See width scaling table below.</p>';
      const usesHtml = (d.use_cases && d.use_cases.length)
        ? `<ul>${d.use_cases.map(u => `<li>${mdInline(u)}</li>`).join('')}</ul>`
        : '<p>General-purpose integer arithmetic datapaths.</p>';

      const scalingRows = (d.scaling || []).map(s => `
        <tr>
          <td class="mono">${s.width}-bit</td>
          <td class="mono">${s.area.toFixed(2)}</td>
          <td class="mono">${s.delay.toFixed(2)}</td>
          <td class="mono">${s.freq.toFixed(1)}</td>
          <td class="mono">${s.power.toFixed(2)}</td>
          <td class="mono">${s.cells}</td>
        </tr>
      `).join('');

      root.innerHTML = `
        <div class="hero" style="padding:24px 28px;">
          <span class="pill pill-pareto" style="margin-bottom:10px;">Classic Design</span>
          <h1>${esc(d.name)} Adder</h1>
          <p style="margin-bottom:0;">${mdInline(d.overview || '')}</p>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card accent-cyan">
            <div class="kpi-val">${d.area_512.toFixed(0)}</div>
            <div class="kpi-label">512-bit Area (&mu;m&sup2;)</div>
          </div>
          <div class="kpi-card accent-yellow">
            <div class="kpi-val">${d.freq_512_mhz.toFixed(1)}</div>
            <div class="kpi-label">512-bit Speed (MHz)</div>
          </div>
          <div class="kpi-card accent-lime">
            <div class="kpi-val">${d.delay_512_ns.toFixed(2)}</div>
            <div class="kpi-label">512-bit Delay (ns)</div>
          </div>
          <div class="kpi-card accent-purple">
            <div class="kpi-val">${d.power_512_mw.toFixed(1)}</div>
            <div class="kpi-label">512-bit Power (mW)</div>
          </div>
        </div>

        <div class="section-card">
          <h2>Block Diagram &amp; Datapath</h2>
          <div class="diagram-toolbar">
            <div class="diagram-legend">
              <span><span class="legend-dot" style="background:#c9f3f4;"></span>Inputs (A, B, Cin)</span>
              <span><span class="legend-dot" style="background:#fff0b9;"></span>Logic / Carry Stages</span>
              <span><span class="legend-dot" style="background:#e7f4c8;"></span>Outputs (Sum, Cout)</span>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn-mini" onclick="setZoom(zoomScale - 0.15)">-</button>
              <span id="zoom-label" class="mono" style="font-size:0.78rem; min-width:44px; text-align:center;">100%</span>
              <button class="btn-mini" onclick="setZoom(zoomScale + 0.15)">+</button>
              <button class="btn-mini" onclick="setZoom(1.0)">Reset</button>
              <button class="btn-mini" style="background:var(--yellow);" onclick="downloadSvg('${d.slug}')">Download SVG</button>
            </div>
          </div>
          <div class="diagram-viewport">
            <div id="diagram-stage" class="diagram-stage">
              ${d.mermaid ? `<pre class="mermaid">${esc(d.mermaid)}</pre>` : '<p>No block diagram available.</p>'}
            </div>
          </div>
        </div>

        <div class="kw-grid" style="margin-bottom:24px;">
          <div class="section-card" style="margin-bottom:0;">
            <h2>Key Characteristics</h2>
            ${charsHtml}
          </div>
          <div class="section-card" style="margin-bottom:0;">
            <h2>Typical Use Cases</h2>
            ${usesHtml}
          </div>
        </div>

        <div class="section-card">
          <h2>Width Scaling (4-bit to 1024-bit)</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Width</th>
                  <th>Area (&mu;m&sup2;)</th>
                  <th>Delay (ns)</th>
                  <th>Frequency (MHz)</th>
                  <th>Power (mW)</th>
                  <th>Cells</th>
                </tr>
              </thead>
              <tbody>${scalingRows}</tbody>
            </table>
          </div>
        </div>
      `;

      if (d.mermaid) {
        await mermaid.run({ querySelector: '.mermaid' });
        colorizeDiagram();
      }
    }

    loadDesign();
  </script>
</body>
</html>
